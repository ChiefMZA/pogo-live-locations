<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff78bd">
  <meta name="description" content="Live local times, DST-aware timezone groups, and public Pokémon GO coordinates.">
  <title>POGO Live Locations</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="POGO Live Locations home">
      <span class="brand-mark" aria-hidden="true">⌖</span>
      <span>
        <strong>POGO</strong>
        <small>LIVE LOCATIONS</small>
      </span>
    </a>
    <div class="local-clock" aria-label="Your current local time">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="clock-label">LOCAL</span>
      <span class="clock-stack">
        <time id="local-clock">--:--:--</time>
        <small id="local-zone">Your timezone</small>
      </span>
    </div>
  </header>

  <main>
    <section class="status-ribbon" aria-label="Site features">
      <span>LIVE WORLD CLOCKS</span>
      <i aria-hidden="true">✦</i>
      <span>AUTO DST</span>
      <i aria-hidden="true">✦</i>
      <span>BUILT FOR TRAINERS WORLDWIDE <b aria-hidden="true">🌍</b></span>
    </section>

    <section class="location-browser" aria-labelledby="browser-title">
      <h2 id="browser-title" class="visually-hidden">Location browser</h2>
      <div class="browser-toolbar">
        <div class="tabs" role="tablist" aria-label="Location lists">
          <button id="tab-hotspots" class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="location-groups" data-tab="hotspots">
            <span aria-hidden="true">🔥</span>
            Hotspots
            <span class="tab-count" data-count="hotspots">0</span>
          </button>
          <button id="tab-timezones" class="tab" type="button" role="tab" aria-selected="false" aria-controls="location-groups" data-tab="timezones">
            <span aria-hidden="true">🌍</span>
            Timezones
            <span class="tab-count" data-count="timezones">0</span>
          </button>
        </div>
        <label class="search-box">
          <span aria-hidden="true">🔎</span>
          <span class="visually-hidden">Search locations</span>
          <input id="location-search" type="search" placeholder="Search a city, country, or timezone" autocomplete="off">
          <kbd>/</kbd>
        </label>
      </div>

      <div class="list-meta">
        <p id="list-summary">Loading live locations…</p>
        <p><span class="auto-dot" aria-hidden="true"></span> DST-aware grouping</p>
      </div>

      <div id="location-groups" class="location-groups" role="tabpanel" aria-labelledby="tab-hotspots" aria-live="polite">
        <div class="loading-state">
          <span class="loading-pin" aria-hidden="true">⌖</span>
          <p>Loading location times…</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <a class="discord-link" href="https://discord.gg/GdAaWg4" target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">💬</span> Join us on Discord <span aria-hidden="true">↗</span>
    </a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">JavaScript is required to display live local times.</p></noscript>
</body>
</html>
